name: ai_vision_pro
description: AI-powered assistive app for blind users with real-time object detection, OCR, and voice commands.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera & Image Processing
  camera: ^0.10.5
  image: ^4.1.3
  
  # ML Kit
  google_mlkit_image_labeling: ^0.11.0
  google_mlkit_text_recognition: ^0.12.0
  
  # Text-to-Speech
  flutter_tts: ^3.8.3
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Voice Recognition
  speech_to_text: ^6.3.0
  
  # State Management
  provider: ^6.0.5
  
  # Utilities
  vibration: ^1.8.4
  audioplayers: ^5.2.1
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
